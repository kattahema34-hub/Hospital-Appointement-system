<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CarePoint - Hospital Appointment System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h2>🏥 CarePoint</h2>
        <nav>
            <a href="#home">Home</a>
            <a href="#register">Register</a>
            <a href="#login">Login</a>
        </nav>
    </header>

    <main id="home">
        <section class="hero">
            <h1>Your Health, Our Priority</h1>
            <p>Book your hospital appointments easily and conveniently.</p>
            <a href="#register" class="btn">Get Started</a>
        </section>

        <section class="form-container" id="register">
            <h2>Patient Registration</h2>
            <form id="registerForm">
                <input id="name" type="text" placeholder="Full Name" required>
                <input id="email" type="email" placeholder="Email Address" required>
                <input id="password" type="password" placeholder="Create Password" required>
                <button type="submit">Register</button>
            </form>
            <p>Already have an account? <a href="#login">Login</a></p>
        </section>

        <section class="form-container" id="login">
            <h2>Patient Login</h2>
            <form id="loginForm">
                <input id="loginEmail" type="email" placeholder="Email Address" required>
                <input id="loginPassword" type="password" placeholder="Password" required>
                <button type="submit">Login</button>
            </form>
            <p id="message"></p>
        </section>
    </main>

    <footer>
        <p>CarePoint Hospital Appointment System</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
